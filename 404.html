<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada (404) | Orlando Montesinos Quintana</title>
    <meta name="description" content="La página que estás buscando no existe o ha sido movida.">
    <meta name="robots" content="noindex, follow">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-icon-180x180.png">
    <meta name="theme-color" content="#ffffff">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --white:      #ffffff;
            --off-white:  #f5f5f5;
            --light-grey: #e8e8e8;
            --mid-grey:   #9a9a9a;
            --dark-grey:  #3a3a3a;
            --black:      #111111;
            --red:        #c8102e;
            --red-dark:   #a00c24;
            --red-subtle: rgba(200,16,46,0.07);
            --font-sans:  'Inter', system-ui, -apple-system, sans-serif;
            --font-mono:  'JetBrains Mono', monospace;
            --container-w: 960px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            background: var(--white);
            color: var(--black);
            font-family: var(--font-sans);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        a { color: var(--red); text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--red-dark); }

        .container { max-width: var(--container-w); margin: 0 auto; padding: 0 1.5rem; width: 100%; }

        /* HEADER */
        header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--light-grey);
        }

        .nav-wrap { display: flex; justify-content: space-between; align-items: center; height: 4rem; }
        .logo { font-family: var(--font-mono); font-weight: 700; color: var(--black); font-size: 1.05rem; }
        .logo span { color: var(--red); }

        /* ERROR MAIN SECTION */
        .error-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 0;
            text-align: center;
        }

        .error-content {
            max-width: 580px;
            margin: 0 auto;
        }

        .error-badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            background: var(--red-subtle);
            color: var(--red);
            padding: 0.35rem 0.85rem;
            border-radius: 2px;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(200,16,46,0.15);
        }

        .error-code {
            font-family: var(--font-mono);
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.05em;
            color: var(--black);
            margin-bottom: 0.5rem;
        }
        .error-code span { color: var(--red); }

        .error-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            color: var(--black);
        }

        .error-desc {
            color: var(--dark-grey);
            font-size: 1rem;
            line-height: 1.65;
            margin-bottom: 2.25rem;
        }

        /* BUTTONS */
        .btn-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.7rem 1.35rem; border-radius: 4px;
            font-weight: 600; font-size: 0.9rem;
            transition: all 0.18s ease; cursor: pointer;
        }

        .btn-primary { background: var(--red); color: #fff; border: 1px solid var(--red); }
        .btn-primary:hover { background: var(--red-dark); border-color: var(--red-dark); color: #fff; transform: translateY(-1px); }

        .btn-outline { border: 1px solid var(--light-grey); color: var(--dark-grey); background: var(--white); }
        .btn-outline:hover { border-color: var(--dark-grey); color: var(--black); transform: translateY(-1px); }

        /* FOOTER */
        footer {
            padding: 2rem 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--mid-grey);
            border-top: 1px solid var(--light-grey);
        }
    </style>
</head>
<body>

    <!-- NAVEGACIÓN -->
    <header>
        <div class="container nav-wrap">
            <a href="/" class="logo">OM<span>.</span>dev</a>
        </div>
    </header>

    <!-- CONTENIDO 404 -->
    <main class="error-section">
        <div class="container">
            <div class="error-content">
                <span class="error-badge">ERROR HTTP 404</span>
                <div class="error-code">404<span>.</span></div>
                <h1 class="error-title">Página no encontrada</h1>
                <p class="error-desc">
                    El recurso que estás intentando consultar no existe, ha sido movido de ruta o la dirección escrita es incorrecta.
                </p>
                <div class="btn-group">
                    <a href="/" class="btn btn-primary">
                        Volver al inicio
                    </a>
                    <a href="https://wa.me/5218126146323?text=Hola%20Orlando,%20encontr%C3%A9%20un%20enlace%20roto%20en%20tu%20sitio%20web" target="_blank" rel="noopener" class="btn btn-outline">
                        Reportar un problema
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Orlando Montesinos Quintana &mdash; Código limpio, sin dependencias innecesarias.</p>
        </div>
    </footer>

</body>
</html>
